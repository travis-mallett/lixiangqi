name: Bot calibration tests

on:
  push:
    paths:
      - 'tools/bot_levels_optimization/**'
      - '!tools/bot_levels_optimization/archive/**'
      - 'external/pikafish_worker/**'
      - 'tools/xiangqi_data/tests/test_ai*.py'
      - '.github/workflows/bot-calibration.yml'
  pull_request:
    paths:
      - 'tools/bot_levels_optimization/**'
      - '!tools/bot_levels_optimization/archive/**'
      - 'external/pikafish_worker/**'
      - 'tools/xiangqi_data/tests/test_ai*.py'
      - '.github/workflows/bot-calibration.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/xiangqi_data/requirements.txt
      - run: python -m unittest discover -s tools/bot_levels_optimization/tests
      - run: python -m unittest tools.xiangqi_data.tests.test_ai_worker tools.xiangqi_data.tests.test_ai_selection tools.xiangqi_data.tests.test_ai_opening
