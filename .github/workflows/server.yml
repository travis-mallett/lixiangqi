name: Build server

on:
  push:
    paths:
      - '.github/workflows/server.yml'
      - 'app/**'
      - 'conf/**'
      - 'modules/**'
      - 'tools/attachment_scanner/tests/publication_http.py'
      - 'tools/attachment_scanner/tests/profile_pictures.py'
      - 'project/**'
      - 'translation/**'
      - 'build.sbt'
      - 'lila.sh'
      - 'conf/application.conf.default'
      - '.sbtopts.default'
    branches-ignore:
      - 'l10n_master'
  pull_request:
    paths:
      - '.github/workflows/server.yml'
      - 'app/**'
      - 'conf/**'
      - 'modules/**'
      - 'tools/attachment_scanner/tests/publication_http.py'
      - 'tools/attachment_scanner/tests/profile_pictures.py'
      - 'project/**'
      - 'translation/source/**'
      - 'build.sbt'
      - 'lila.sh'
      - 'conf/application.conf.default'
      - '.sbtopts.default'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LIXIANGQI_PUBLICATION_TEST_URI: mongodb://127.0.0.1:27291
      LIXIANGQI_ANALYSIS_TEST_URI: mongodb://127.0.0.1:27291
      LIXIANGQI_EXTERNAL_LOGIN_TEST_URI: mongodb://127.0.0.1:27291
      LIXIANGQI_MSG_TEST_URI: mongodb://127.0.0.1:27291
      LIXIANGQI_IN_PLAY_TEST_URI: mongodb://127.0.0.1:27291
      LIXIANGQI_MEDIA_REPLICA_URI: mongodb://127.0.0.1:27291
    strategy:
      matrix:
        java-version: [21]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@3afe9cf056c5d139bfc46579af1192d77a2f0821 # v1.4.0
      - run: TZ=UTC git log -1 --date=iso-strict-local --pretty='format:app.version.commit = "%H"%napp.version.date = "%ad"%napp.version.message = """%s"""%n' | tee conf/version.conf
      - name: Start the test MongoDB replica set
        run: |
          docker run -d --name test-mongo -p 127.0.0.1:27291:27291 mongo:8.2 --port 27291 --replSet ci --bind_ip_all
          timeout 60 bash -c 'until docker exec test-mongo mongosh --port 27291 --quiet --eval "db.adminCommand({ping:1})" >/dev/null 2>&1; do sleep 1; done'
          docker exec test-mongo mongosh --port 27291 --quiet --eval '
            const result = rs.initiate({_id:"ci",members:[{_id:0,host:"127.0.0.1:27291"}]});
            if (result.ok !== 1) throw new Error(EJSON.stringify(result));
          '
          timeout 30 bash -c 'until docker exec test-mongo mongosh --port 27291 --quiet --eval "quit(db.hello().isWritablePrimary ? 0 : 1)"; do sleep 1; done'
      - run: ./lila.sh -Depoll=true "test;stage"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.13'
      - name: Verify authenticated forum and inbox publication
        run: |
          docker run -d --name media-test-redis -p 127.0.0.1:26402:6379 redis:8-alpine
          python -m pip install -r tools/attachment_scanner/requirements.txt
          python tools/attachment_scanner/tests/publication_http.py --mongo-port 27291 --redis-port 26402
      - run: cp LICENSE COPYING.md README.md target/universal/stage && git log -n 1 --pretty=oneline > target/universal/stage/commit.txt
      - run: cd target/universal/stage && tar --zstd -cvpf ../../../lila-3.0.tar.zst . && cd -
        env:
          ZSTD_LEVEL: 1 # most files are already zipped
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.java-version == 21 }}
        with:
          name: lila-server
          path: lila-3.0.tar.zst
          compression-level: 0 # already compressed

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    concurrency:
      group: docker-build-publish
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lila-server

      - name: Extract artifact
        run: |
          mkdir -p lila
          tar --zstd -xvf *.tar.zst -C lila

      - name: Copy default conf
        run: |
          cp -r conf lila

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .github/workflows/docker/lila.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: deploy preview
    if: github.repository_owner == 'lichess-org' && github.ref_name == github.event.repository.default_branch
    needs: docker
    uses: lichess-org/.github/.github/workflows/deploy.yml@main
    secrets:
      deploy_webhook_url: ${{ secrets.DEPLOY_PREVIEW_SERVER_URL }}

  format:
    runs-on: ubuntu-latest
    env:
      SBT_OPTS: -Dsbt.banner=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@3afe9cf056c5d139bfc46579af1192d77a2f0821 # v1.4.0

      - name: Check Formatting
        run: sbt scalafmtCheckAll
