name: Attachment scanner

on:
  push:
    paths: ['tools/attachment_scanner/**', '.github/workflows/attachment-scanner.yml']
  pull_request:
    paths: ['tools/attachment_scanner/**', '.github/workflows/attachment-scanner.yml']

jobs:
  screening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r tools/attachment_scanner/requirements.txt
      - name: Start a MongoDB replica set for transactional publication
        run: |
          docker run -d --name scanner-mongo -p 127.0.0.1:27017:27017 mongo:8.2 --replSet ci --bind_ip_all
          timeout 60 bash -c 'until docker exec scanner-mongo mongosh --quiet --eval "db.adminCommand({ping:1})" >/dev/null 2>&1; do sleep 1; done'
          docker exec scanner-mongo mongosh --quiet --eval '
            const result = rs.initiate({_id:"ci",members:[{_id:0,host:"127.0.0.1:27017"}]});
            if (result.ok !== 1) throw new Error(EJSON.stringify(result));
          '
          timeout 30 bash -c 'until docker exec scanner-mongo mongosh --quiet --eval "quit(db.hello().isWritablePrimary ? 0 : 1)"; do sleep 1; done'
      - run: python -m unittest discover -s tools/attachment_scanner/tests -v
        env:
          PYTHONPATH: tools/attachment_scanner
          LIXIANGQI_MSG_TEST_URI: mongodb://127.0.0.1:27017
